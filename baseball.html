<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다이아몬드 야구</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(ellipse at top,#263d5b,#09111e 70%);color:#f5f8ff;font-family:system-ui,'Noto Sans KR',sans-serif;display:grid;place-items:center}.wrap{width:min(1050px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{margin:0;font-size:clamp(25px,4vw,38px)}.sub{color:#a9bdd9;font-size:13px;margin-top:5px}.game{border:1px solid #344a68;background:#142239;border-radius:22px;padding:16px;box-shadow:0 25px 80px #0008}.scoreboard{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.cell{background:#081525;border:1px solid #293d58;border-radius:12px;text-align:center;padding:10px}.caption{font-size:11px;color:#9eb3d1;letter-spacing:.06em}.value{font-size:clamp(19px,3vw,29px);font-weight:900;font-variant-numeric:tabular-nums}.teams{display:flex;justify-content:center;gap:10px;align-items:center;font-size:12px;margin-top:5px}.team{padding:3px 8px;border-radius:6px;background:#223b5c}.team.active{background:#ffd34e;color:#142033;font-weight:900}canvas{width:100%;height:auto;display:block;border-radius:15px;background:#69ae45;touch-action:manipulation}.lower{display:grid;grid-template-columns:1fr minmax(180px,280px);gap:12px;margin-top:12px}.message{min-height:54px;border-radius:12px;background:#091626;padding:12px;display:flex;align-items:center;font-weight:800;color:#ffe17a}.timing{background:#091626;border-radius:12px;padding:10px}.timing label{font-size:12px;color:#a9bdd9;display:flex;justify-content:space-between}.meter{height:16px;border-radius:10px;background:linear-gradient(90deg,#d94c4c 0 28%,#f2b842 28% 42%,#41cf7b 42% 58%,#f2b842 58% 72%,#d94c4c 72%);margin-top:8px;position:relative;overflow:hidden}.needle{position:absolute;top:-2px;left:0;width:4px;height:20px;background:white;box-shadow:0 0 7px white}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:900;background:#ffd34e;color:#142033;box-shadow:0 4px 0 #b78e22;cursor:pointer}button.secondary{background:#dce8fa;box-shadow:0 4px 0 #94a9c8}button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}.tips{font-size:12px;color:#9fb2ce;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:620px){.scoreboard{grid-template-columns:1fr 1fr}.lower{grid-template-columns:1fr}.game{padding:10px}}
</style></head><body><main class="wrap"><header><div><h1>⚾ 다이아몬드 야구</h1><div class="sub">타이밍을 맞춰 안타와 홈런을 만들어 보세요!</div></div><button class="secondary" id="reset">새 경기</button></header>
<section class="game"><div class="scoreboard"><div class="cell"><div class="caption">이닝 · 공격</div><div class="value" id="inning">1회 초</div><div class="teams"><span id="home" class="team active">블루</span><b>VS</b><span id="away" class="team">레드</span></div></div><div class="cell"><div class="caption">SCORE</div><div class="value"><span id="runs">0</span> : <span id="opp">0</span></div></div><div class="cell"><div class="caption">OUT · BALL · STRIKE</div><div class="value" id="count">0 · 0 · 0</div></div><div class="cell"><div class="caption">타자</div><div class="value" id="batter">1번</div><div class="caption" id="record">타율 .000</div></div></div>
<canvas id="field" width="1000" height="560" aria-label="야구장"></canvas>
<div class="lower"><div class="message" id="message">투수가 준비됐어요. 투구를 시작하세요!</div><div class="timing"><label><span>타격 타이밍</span><span id="timingText">공을 기다리세요</span></label><div class="meter"><div class="needle" id="needle"></div></div></div></div>
<div class="controls"><button id="pitch">⚾ 투구</button><button id="swing">🔥 타격!</button><button class="secondary" id="walk">볼 기다리기</button><button class="secondary" id="next">다음 타자</button></div>
<div class="tips"><span>조작: 스페이스바 또는 화면 클릭 = 타격</span><span>초록 구간에 맞추면 정확한 타격!</span></div></section></main>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let inning=1,top=true,runs=0,opp=0,outs=0,balls=0,strikes=0,base=[0,0,0],pitch=null,anim=0,phase='ready',batter=1,hits=0,atBats=0,message='투수가 준비됐어요. 투구를 시작하세요!',lastSwing=0,needleX=0;
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function player(x,y,scale,jersey,pose){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#152238';ctx.beginPath();ctx.ellipse(0,48,26,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1c59b';ctx.beginPath();ctx.arc(0,-28,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#25364c';ctx.beginPath();ctx.arc(0,-33,18,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle=jersey;ctx.fillRect(-17,-12,34,38);ctx.strokeStyle='#f4f7ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-12,22);ctx.lineTo(-15,44);ctx.moveTo(12,22);ctx.lineTo(15,44);ctx.stroke();ctx.strokeStyle='#e8bd91';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-15,-4);ctx.lineTo(-27,pose? -24:8);ctx.moveTo(15,-4);ctx.lineTo(28,pose? -15:9);ctx.stroke();ctx.fillStyle='#f5f5f5';ctx.beginPath();ctx.arc(28,pose?-15:9,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){let w=1000,h=560;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,210);sky.addColorStop(0,'#8bd0ff');sky.addColorStop(1,'#d7f0ff');ctx.fillStyle=sky;ctx.fillRect(0,0,w,210);
// crowd stands
ctx.fillStyle='#34445b';ctx.fillRect(0,90,1000,115);for(let i=0;i<120;i++){ctx.fillStyle=['#f4d35e','#f5f7ff','#ef6c65','#72c7a1'][i%4];ctx.beginPath();ctx.arc((i*83)%1000,110+(i%5)*17,4,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#447b36';ctx.fillRect(0,205,1000,355);ctx.fillStyle='#5ca342';ctx.beginPath();ctx.ellipse(500,400,460,210,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#d9b47d';ctx.beginPath();ctx.moveTo(500,240);ctx.lineTo(770,405);ctx.lineTo(500,530);ctx.lineTo(230,405);ctx.closePath();ctx.fill();
ctx.strokeStyle='#fff2d4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(500,240);ctx.lineTo(770,405);ctx.lineTo(500,530);ctx.lineTo(230,405);ctx.closePath();ctx.stroke();
ctx.fillStyle='#3d8a3b';ctx.beginPath();ctx.moveTo(500,240);ctx.lineTo(700,365);ctx.lineTo(500,455);ctx.lineTo(300,365);ctx.closePath();ctx.fill();
ctx.fillStyle='#f8f0d7';ctx.beginPath();ctx.moveTo(500,485);ctx.lineTo(484,469);ctx.lineTo(484,451);ctx.lineTo(516,451);ctx.lineTo(516,469);ctx.closePath();ctx.fill();
[['2',500,240,1],['3',230,405,2],['1',770,405,0]].forEach(([n,x,y,i])=>{ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=base[i]?'#ffe45e':'#fff';ctx.fillRect(-14,-14,28,28);ctx.strokeStyle='#8e754a';ctx.lineWidth=2;ctx.strokeRect(-14,-14,28,28);ctx.restore();if(base[i]){ctx.fillStyle='#ef554e';ctx.beginPath();ctx.arc(x,y-25,13,0,Math.PI*2);ctx.fill()}});
player(430,375,.8,'#285fce',false);player(570,310,.85,'#c64242',true);
ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('PITCHER',540,255);ctx.fillText('BATTER',385,315);
ctx.fillStyle='#152238';ctx.fillRect(410,205,180,130);ctx.strokeStyle='#f7f7ff';ctx.lineWidth=4;ctx.strokeRect(410,205,180,130);ctx.fillStyle='#ffffff20';ctx.fillRect(410,205,180,130);
if(pitch){ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pitch.x,pitch.y,pitch.radius||12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d34c48';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pitch.x-8,pitch.y-3);ctx.lineTo(pitch.x+8,pitch.y+3);ctx.stroke()}
if(phase==='swing'){ctx.strokeStyle='#fce17a';ctx.lineWidth=8;ctx.beginPath();ctx.arc(430,350,90,-.8,.8);ctx.stroke()}
ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.fillText('다이아몬드 스타디움',25,35);ctx.fillStyle='#18314b';ctx.fillRect(20,48,170,40);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText('주자 상황',32,73);for(let i=0;i<3;i++){ctx.fillStyle=base[i]?'#ffdf51':'#dce7f6';ctx.save();ctx.translate(70+i*45,105);ctx.rotate(Math.PI/4);ctx.fillRect(-10,-10,20,20);ctx.restore()}
}
function update(){ $('inning').textContent=inning+'회 '+(top?'초':'말');$('runs').textContent=runs;$('opp').textContent=opp;$('count').textContent=outs+' · '+balls+' · '+strikes;$('batter').textContent=batter+'번';$('record').textContent='타율 '+(atBats?'.'+String(Math.floor(hits/atBats*1000)).padStart(3,'0'):' .000');$('message').textContent=message;$('home').classList.toggle('active',top);$('away').classList.toggle('active',!top);draw()}
function animate(){if(pitch&&phase==='flying'){pitch.x+=pitch.vx;pitch.y+=pitch.vy;pitch.radius=10+Math.sin(Date.now()/50)*2;if(pitch.y>350||pitch.x<370||pitch.x>630){phase='inZone';message='지금 타격하세요!';$('timingText').textContent='타격 타이밍!';needleX=48+Math.random()*8;$ ('needle').style.left=needleX+'%';} }draw();anim=requestAnimationFrame(animate)}
function startPitch(){if(phase==='flying'||phase==='inZone'){message='이미 공이 날아오고 있어요!';update();return}phase='flying';pitch={x:565,y:290,vx:-4.5-Math.random()*1.8,vy:2.3+Math.random()*1.5,radius:12};message='투수가 공을 던졌어요!';$('timingText').textContent='공이 날아오는 중';update()}
function swing(){if(!pitch||!['flying','inZone'].includes(phase)){message='먼저 투구 버튼을 눌러주세요!';update();return}atBats++;let accuracy=phase==='inZone'?Math.random():Math.random()+0.35;pitch=null;phase='ready';if(accuracy<.22){hits++;advance(3);message='💥 홈런! 담장을 넘겼습니다!';}else if(accuracy<.48){hits++;advance(2);message='🔥 장타! 2루타입니다!';}else if(accuracy<.72){hits++;advance(1);message='안타! 주자가 출루합니다!';}else{strikes++;message='헛스윙! 스트라이크';if(strikes>=3){outs++;strikes=0;message='삼진 아웃!';}}checkOut();update()}
function advance(n){for(let i=2;i>=0;i--){if(base[i]){if(i+n>=3)runs++;else base[i+n]=1;base[i]=0}}if(n<3)base[n-1]=1}
function checkOut(){if(outs>=3){outs=0;balls=0;strikes=0;base=[0,0,0];top=!top;if(top)inning++;if(inning>9){message=runs===opp?'경기 종료! 무승부입니다!':runs>opp?'🏆 경기 종료! 블루팀 승리!':'경기 종료! 레드팀 승리!';$('pitch').disabled=true;$('swing').disabled=true;return}if(!top){opp+=Math.floor(Math.random()*2);message='공수 교대! 상대팀이 '+(Math.random()<.5?'삼진':'안타')+'를 기록했어요.'}else message=inning+'회 초! 다시 공격합니다.'}batter=batter%9+1}
function walk(){if(phase!=='ready'){message='공이 끝난 뒤 선택하세요';update();return}balls++;message='볼! '+balls+'볼';if(balls>=4){advance(1);balls=0;strikes=0;message='볼넷! 1루로 출루';}update()}
function reset(){inning=1;top=true;runs=opp=outs=balls=strikes=hits=atBats=0;batter=1;base=[0,0,0];pitch=null;phase='ready';$('pitch').disabled=false;$('swing').disabled=false;message='새 경기가 시작됐어요!';update()}
$('pitch').onclick=startPitch;$('swing').onclick=swing;$('walk').onclick=walk;$('next').onclick=()=>{if(phase!=='ready'){pitch=null;phase='ready'}outs++;strikes=balls=0;message='다음 타자로 교체합니다.';checkOut();update()};$('reset').onclick=reset;canvas.onclick=swing;window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();swing()}});
update();animate();
</script></body></html>
